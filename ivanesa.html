<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ιβανέσα — Αστεράκια</title>
<style>
:root{--p:#7c3aed;--p2:#a78bfa;--bg:#faf8ff;--ink:#1f2937;--muted:#6b7280;--line:#e8e5f0}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(180deg,#f7f5ff,#fff 38%,#fff9ed);color:var(--ink);min-height:100vh}
header{position:sticky;top:0;z-index:5;padding:14px 16px;background:rgba(250,248,255,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.wrap,.head{max-width:720px;margin:auto}.wrap{padding:16px 14px 40px}h1{margin:0;font-size:22px}.muted{color:var(--muted);font-size:12px;margin-top:4px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px}.tab{border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px;font-weight:850}.tab.active{background:var(--p);color:#fff;border-color:var(--p)}
.hero{background:linear-gradient(135deg,#6d28d9,#8b5cf6,#c084fc);color:white;border-radius:24px;padding:18px;box-shadow:0 14px 36px rgba(124,58,237,.20);margin-bottom:13px}
.heroTop{display:flex;justify-content:space-between;gap:12px}.name{font-size:25px;font-weight:900}.stars{font-size:32px;font-weight:900;text-align:right}
.progress{height:11px;border-radius:99px;background:rgba(255,255,255,.24);overflow:hidden;margin-top:13px}.bar{height:100%;background:#fff;border-radius:99px;width:0}
.heroFoot{display:flex;justify-content:space-between;font-size:12px;margin-top:7px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.linkBtn{text-decoration:none;text-align:center;border-radius:14px;padding:11px;background:#fff;border:1px solid var(--line);font-weight:800;color:var(--p)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:15px 0}.day{border:0;border-radius:12px;padding:10px 2px;background:#f0eef6;font-size:11px;font-weight:850}.day.active{background:var(--p);color:#fff}
.sec{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 9px}.sec h2{font-size:17px;margin:0}.badge{font-size:11px;background:#f3efff;color:var(--p);padding:6px 9px;border-radius:99px;font-weight:850}
.task{display:flex;gap:11px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px;margin-bottom:8px}.task.done{background:#f0fdf4;border-color:#bbf7d0}
.taskText{flex:1}.taskName{font-size:14px;font-weight:800;line-height:1.25}.taskNote{font-size:11px;color:var(--muted);margin-top:3px}.star{width:46px;height:46px;border:0;border-radius:14px;background:#f3f4f6;font-size:23px}.task.done .star{background:#fef3c7}
.star{display:flex;align-items:center;justify-content:center;padding:0;color:#303746}
.starSvg{width:28px;height:28px;display:block}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px;text-align:center}.n{font-size:20px;font-weight:900}.l{font-size:10px;color:var(--muted)}
.box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:16px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{border:0;border-radius:13px;padding:11px 12px;font-weight:850;background:var(--p);color:#fff}.btn2{background:#f3f4f6;color:#374151}.status{font-size:11px;color:var(--muted)}
.reward{display:flex;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:8px}.reward.on{background:#fffbeb;border-color:#fde68a}.need{font-size:12px;color:var(--muted);white-space:nowrap}
@media(max-width:390px){.name{font-size:22px}.stars{font-size:28px}.wrap{padding-left:10px;padding-right:10px}}

/* Stitch-inspired background only — logic untouched */
body{background:
  radial-gradient(circle at 20% 8%,rgba(255,255,255,.72),transparent 26%),
  radial-gradient(circle at 82% 12%,rgba(255,181,222,.24),transparent 22%),
  linear-gradient(180deg,#dff7ff 0%,#e9ecff 48%,#fff0fb 100%)!important;
  position:relative;overflow-x:hidden}
header{background:rgba(235,248,255,.9)!important;border-bottom:1px solid #cbe6f9!important}
.hero{background:linear-gradient(135deg,#4ba7f5,#7288f5,#b286f3)!important;box-shadow:0 14px 36px rgba(66,135,220,.22)!important}
.card,.task,.reward,.box{background:rgba(255,255,255,.90)!important;border-color:#d8e8f6!important;backdrop-filter:blur(6px)}
.day{background:#eef7ff!important;color:#42668a!important}.day.active{background:#56a9f2!important;color:white!important}
.badge{background:#edf6ff!important;color:#377bb6!important}
.theme-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;opacity:.20}
.theme-bg span{position:absolute;font-size:30px;text-shadow:0 0 16px rgba(71,147,229,.25)}
.theme-bg .i1{top:8%;left:4%;font-size:38px}.theme-bg .i2{top:16%;right:5%;font-size:34px}
.theme-bg .i3{top:33%;left:3%;font-size:36px}.theme-bg .i4{top:46%;right:4%;font-size:34px}
.theme-bg .i5{top:62%;left:5%;font-size:40px}.theme-bg .i6{top:76%;right:3%;font-size:35px}
.theme-bg .i7{top:89%;left:38%;font-size:32px}
.stitch-ear{display:inline-block;width:52px;height:28px;border-radius:50% 50% 45% 45%;background:#54a9f2;transform:rotate(-8deg);position:relative;opacity:.75}
.stitch-ear:before,.stitch-ear:after{content:"";position:absolute;top:-8px;width:22px;height:38px;background:#54a9f2;border-radius:70% 30% 70% 30%}
.stitch-ear:before{left:-14px;transform:rotate(-38deg)}.stitch-ear:after{right:-14px;transform:scaleX(-1) rotate(-38deg)}
header,main{position:relative;z-index:1}


/* idle dance overlay */
.idleDanceOverlay{
  position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;visibility:hidden;transition:opacity .25s ease,visibility .25s ease;
  background:linear-gradient(180deg,rgba(217,245,255,.20),rgba(239,232,255,.24));
  backdrop-filter:blur(1px)
}
.idleDanceOverlay.show{opacity:1;visibility:visible}
.alienStage{position:relative;width:230px;height:300px;display:flex;align-items:center;justify-content:center}
.alienShadow{position:absolute;bottom:28px;width:120px;height:20px;border-radius:50%;background:rgba(60,90,150,.16);filter:blur(4px);animation:shadowPulse .8s ease-in-out infinite}
.blueAlien{position:relative;width:145px;height:190px;animation:danceBody .8s ease-in-out infinite;filter:drop-shadow(0 16px 18px rgba(65,115,185,.2))}
.alienHead{position:absolute;left:22px;top:15px;width:101px;height:86px;border-radius:48% 48% 44% 44%;background:#58aaf1;border:3px solid #2f72b0}
.alienEar{position:absolute;top:28px;width:62px;height:34px;background:#58aaf1;border:3px solid #2f72b0;border-radius:65% 35% 65% 35%}
.alienEar:after{content:"";position:absolute;inset:6px 8px;border-radius:inherit;background:#e99bca;opacity:.85}
.alienEar.left{left:-34px;transform:rotate(-24deg);animation:earLeft .8s ease-in-out infinite}.alienEar.right{right:-34px;transform:scaleX(-1) rotate(-24deg);animation:earRight .8s ease-in-out infinite}
.eye{position:absolute;top:31px;width:22px;height:31px;border-radius:50%;background:#dff6ff;border:2px solid #8cc8e9}.eye:after{content:"";position:absolute;width:8px;height:13px;background:#16263d;border-radius:50%;left:7px;top:9px}
.eye.left{left:25px}.eye.right{right:25px}
.nose{position:absolute;left:40px;top:57px;width:21px;height:14px;background:#243650;border-radius:50%}
.mouth{position:absolute;left:31px;top:69px;width:39px;height:10px;border-bottom:4px solid #243650;border-radius:0 0 30px 30px}
.alienBody{position:absolute;left:34px;top:91px;width:77px;height:78px;border-radius:44% 44% 48% 48%;background:#4c9de7;border:3px solid #2f72b0}
.alienBody:after{content:"";position:absolute;left:18px;top:18px;width:35px;height:45px;border-radius:50%;background:#a8dcf4}
.arm,.leg{position:absolute;background:#4c9de7;border:3px solid #2f72b0}
.arm{top:104px;width:46px;height:19px;border-radius:20px}.arm.left{left:3px;transform:rotate(22deg);transform-origin:right center;animation:armLeft .8s ease-in-out infinite}.arm.right{right:3px;transform:rotate(-22deg);transform-origin:left center;animation:armRight .8s ease-in-out infinite}
.leg{top:157px;width:27px;height:43px;border-radius:18px}.leg.left{left:43px;transform-origin:top center;animation:legLeft .8s ease-in-out infinite}.leg.right{right:43px;transform-origin:top center;animation:legRight .8s ease-in-out infinite}
.musicFloat{position:absolute;font-size:28px;color:#6d7eea;font-weight:900;animation:musicFloat 1.4s ease-in-out infinite}.mf1{left:8px;top:50px}.mf2{right:8px;top:78px;animation-delay:.45s}
.idleDanceCaption{position:absolute;bottom:0;background:rgba(255,255,255,.84);border:1px solid #d6eafb;color:#47749d;padding:7px 12px;border-radius:999px;font-size:11px;font-weight:850;white-space:nowrap}
@keyframes danceBody{0%,100%{transform:translateY(0) rotate(-3deg)}25%{transform:translateY(-12px) rotate(3deg)}50%{transform:translateY(0) rotate(4deg)}75%{transform:translateY(-9px) rotate(-4deg)}}
@keyframes shadowPulse{0%,100%{transform:scaleX(1);opacity:.17}50%{transform:scaleX(.72);opacity:.1}}
@keyframes earLeft{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(-38deg)}}@keyframes earRight{0%,100%{transform:scaleX(-1) rotate(-24deg)}50%{transform:scaleX(-1) rotate(-38deg)}}
@keyframes armLeft{0%,100%{transform:rotate(22deg)}50%{transform:rotate(-30deg)}}@keyframes armRight{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(30deg)}}
@keyframes legLeft{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-18deg)}}@keyframes legRight{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(18deg)}}
@keyframes musicFloat{0%,100%{transform:translateY(8px) rotate(-8deg);opacity:.3}50%{transform:translateY(-12px) rotate(8deg);opacity:.9}}

</style></head>
<body><div class="theme-bg" aria-hidden="true">
<span class="i1">🌺</span><span class="i2">💙</span><span class="i3">🐾</span><span class="i4">✨</span><span class="i5"><i class="stitch-ear"></i></span><span class="i6">🌸</span><span class="i7">💜</span>
</div>
<div id="idleDanceOverlay" class="idleDanceOverlay" aria-hidden="true">
  <div class="alienStage">
    <div class="musicFloat mf1">♪</div><div class="musicFloat mf2">♫</div>
    <div class="alienShadow"></div>
    <div class="blueAlien">
      <div class="alienEar left"></div><div class="alienEar right"></div>
      <div class="alienHead">
        <div class="eye left"></div><div class="eye right"></div><div class="nose"></div><div class="mouth"></div>
      </div>
      <div class="alienBody"></div>
      <div class="arm left"></div><div class="arm right"></div>
      <div class="leg left"></div><div class="leg right"></div>
    </div>
    <div class="idleDanceCaption">Χορευτικό διάλειμμα 💙</div>
  </div>
</div>
<header><div class="head"><h1>Ιβανέσα ⭐</h1><div class="muted">Η δική μου εβδομάδα • μόνο προβολή</div></div></header>
<main class="wrap">
<section class="hero"><div class="heroTop"><div><div class="muted" style="color:#eee">Μπράβο Ιβανέσα! ✨</div><div class="name">Τα αστεράκια μου</div></div><div><div class="stars" id="ws">0 ★</div><div class="muted" style="color:#eee;text-align:right">αυτή την εβδομάδα</div></div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="heroFoot"><span id="wk">—</span><span id="pct">0%</span></div></section>
<div class="cards"><div class="card"><div class="n" id="td">0</div><div class="l">★ σήμερα</div></div><div class="card"><div class="n" id="left">0</div><div class="l">μένουν σήμερα</div></div><div class="card"><div class="n">60</div><div class="l">στόχος</div></div></div>
<div class="days" id="days"></div><div id="tasks"></div>
<div class="sec"><h2>🎁 Ανταμοιβές</h2><span class="badge">στόχοι</span></div><div id="rewards"></div>
<div class="box"><b>🔄 Αυτόματη ενημέρωση</b><div class="status" id="status" style="margin-top:5px">Σύνδεση…</div><div class="status" style="margin-top:7px">Κάθε Δευτέρα ξεκινά καινούρια εβδομάδα από 0 ★.</div></div>
</main>
<script>
var API="https://annzsqojhqmxwsascarz.supabase.co/functions/v1/family-stars-api", CHILD="ivanesa", TASKS=[["🌅 Πρωί","Στρώνω το κρεβάτι μου",[0,1,2,3,4,5,6],""],["🌅 Πρωί","Διπλώνω τις πιτζάμες και τις βάζω στη θέση τους",[0,1,2,3,4,5,6],""],["🌅 Πρωί","Πλένω δόντια",[0,1,2,3,4,5,6],""],["🌅 Πρωί","Πλένω πρόσωπο / χέρια",[0,1,2,3,4,5,6],""],["🌅 Πρωί","Παπούτσια / παντόφλες στη θέση τους",[0,1,2,3,4,5,6],""],["🎒 Μετά το σχολείο","Βάζω τσάντα και παπούτσια στη θέση τους",[0,1,2,3,4],"Σχολικές μέρες"],["🎒 Μετά το σχολείο","Πλένω χέρια πριν το φαγητό",[0,1,2,3,4,5,6],""],["🎒 Μετά το σχολείο","Τακτοποιώ τα καθαρά ρούχα",[0,1,2,3,4,5,6],""],["🎒 Μετά το σχολείο","Βάζω τα λερωμένα ρούχα στο καλάθι / πλυντήριο",[0,1,2,3,4,5,6],""],["📚 Μελέτη","Κάνω τα μαθήματά μου μετά την ξεκούραση",[0,1,2,3,4],"Μετά από 30–45 λεπτά ξεκούραση"],["📱 Χρόνος","Κινητό / internet μόνο στον συμφωνημένο χρόνο",[0,1,2,3,4,5,6],""],["👕 Ρούχα","Μαζεύω καθαρά ρούχα από την απλώστρα όταν υπάρχουν",[0,1,2,3,4,5,6],""],["🧸 Τακτοποίηση","Μαζεύω παιχνίδια και κρατώ το δωμάτιο τακτοποιημένο",[0,1,2,3,4,5,6],""],["🛁 Βράδυ","Κάνω μπάνιο",[0,1,2,3,4,5,6],""],["🛁 Βράδυ","Λούζω τα μαλλιά",[0,2,5],"Δευτέρα • Τετάρτη • Σάββατο"],["🛁 Βράδυ","Πλένω δόντια",[0,1,2,3,4,5,6],""],["🎒 Βράδυ","Ετοιμάζω ρούχα / πράγματα για αύριο",[0,1,2,3,4],"Σχολικές μέρες"],["🧹 Σπίτι","Σκούπα + σφουγγάρισμα / βοήθεια",[0,2,5],"Δευτέρα • Τετάρτη • Σάββατο — ή όταν χρειάζεται"]], DAYS=["Δευ","Τρι","Τετ","Πεμ","Παρ","Σαβ","Κυρ"], FULL=["Δευτέρα","Τρίτη","Τετάρτη","Πέμπτη","Παρασκευή","Σάββατο","Κυριακή"];
var selected=(new Date().getDay()+6)%7,marks=new Set(),weekStart="";
function key(d,i){return d+":"+i}
function starSvg(filled){return '<svg class="starSvg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.7l2.86 5.8 6.4.93-4.63 4.51 1.09 6.37L12 17.32l-5.72 3.01 1.09-6.37-4.63-4.51 6.4-.93L12 2.7z" fill="'+(filled?'#F7C948':'none')+'" stroke="'+(filled?'#E0A800':'currentColor')+'" stroke-width="1.8" stroke-linejoin="round"/></svg>'}
function dayStats(d){var total=0,done=0;TASKS.forEach(function(t,i){if(t[2].indexOf(d)>=0){total++;if(marks.has(key(d,i)))done++}});return {total:total,done:done}}
function weekLabel(s){if(!s)return "—";var d=new Date(s+"T00:00:00"),e=new Date(d);e.setDate(e.getDate()+6);return d.toLocaleDateString("el-GR",{day:"numeric",month:"short"})+" – "+e.toLocaleDateString("el-GR",{day:"numeric",month:"short"})}
async function load(){try{var r=await fetch(API+"?child="+CHILD+"&t="+Date.now(),{cache:"no-store"});var j=await r.json();if(!r.ok)throw new Error();marks=new Set((j.marks||[]).filter(function(x){return x.done}).map(function(x){return key(x.day_index,x.task_id)}));weekStart=j.week_start;status.textContent="Ενημερώθηκε "+new Date().toLocaleTimeString("el-GR",{hour:"2-digit",minute:"2-digit"});render()}catch(e){status.textContent="Δεν έγινε σύνδεση • δοκίμασε refresh"}}
function render(){var w=marks.size,p=Math.min(100,Math.round(w/60*100));ws.textContent=w+" ★";bar.style.width=p+"%";pct.textContent=p+"%";wk.textContent=weekLabel(weekStart);var ds=dayStats(selected);td.textContent=ds.done;left.textContent=Math.max(0,ds.total-ds.done);
days.innerHTML="";DAYS.forEach(function(n,d){var b=document.createElement("button");b.className="day"+(d===selected?" active":"");b.textContent=n;b.onclick=function(){selected=d;render()};days.appendChild(b)});
tasks.innerHTML="";var groups={};TASKS.forEach(function(t,i){if(t[2].indexOf(selected)>=0){if(!groups[t[0]])groups[t[0]]=[];groups[t[0]].push([t,i])}});Object.keys(groups).forEach(function(cat){var h=document.createElement("div");h.className="sec";h.innerHTML="<h2>"+cat+"</h2><span class='badge'>"+FULL[selected]+"</span>";tasks.appendChild(h);groups[cat].forEach(function(x){var t=x[0],i=x[1],dn=marks.has(key(selected,i)),d=document.createElement("div");d.className="task"+(dn?" done":"");d.innerHTML="<div class='taskText'><div class='taskName'>"+t[1]+"</div>"+(t[3]?"<div class='taskNote'>"+t[3]+"</div>":"")+"</div><div class='star'>"+starSvg(dn)+"</div>";tasks.appendChild(d)})});
var rr=[[25,"Διαλέγω οικογενειακό παιχνίδι"],[40,"Διαλέγω ταινία"],[55,"Διαλέγω γλυκό / επιδόρπιο"],[70,"Ξεχωριστή δραστηριότητα Σαββατοκύριακου"]];rewards.innerHTML="";rr.forEach(function(r){var d=document.createElement("div");d.className="reward"+(w>=r[0]?" on":"");d.innerHTML="<b>"+(w>=r[0]?"🎉 ":"")+r[1]+"</b><span class='need'>"+r[0]+" ★</span>";rewards.appendChild(d)})}

var idleDanceTimer=null;
var IDLE_DANCE_MS=15000;
function showIdleDance(){var o=document.getElementById("idleDanceOverlay");if(o)o.classList.add("show");}
function resetIdleDance(){
  var o=document.getElementById("idleDanceOverlay");if(o)o.classList.remove("show");
  if(idleDanceTimer)clearTimeout(idleDanceTimer);
  idleDanceTimer=setTimeout(showIdleDance,IDLE_DANCE_MS);
}
["pointerdown","touchstart","scroll","keydown","click"].forEach(function(evt){
  document.addEventListener(evt,resetIdleDance,{passive:true});
});
document.addEventListener("visibilitychange",function(){
  if(document.hidden){if(idleDanceTimer)clearTimeout(idleDanceTimer);}
  else{resetIdleDance();}
});
resetIdleDance();

render();load();setInterval(load,5000);
</script></body></html>
